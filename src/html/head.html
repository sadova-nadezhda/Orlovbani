<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@@title</title>

  <link rel="apple-touch-icon" sizes="180x180" href="@img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="@img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="@img/favicon-16x16.png">
  <link rel="manifest" href="@img/site.webmanifest">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    document.documentElement.classList.add("is-loading");
    setTimeout(function () {
      document.documentElement.classList.remove("is-loading");
    }, 3000);

    // прелоудер с бликом на логотипе показываем не чаще раза в сутки
    try {
      var preloaderKey = "preloader-shown-date";
      var preloaderToday = new Date().toISOString().slice(0, 10);
      if (localStorage.getItem(preloaderKey) === preloaderToday) {
        document.documentElement.classList.add("no-preloader");
      }
    } catch (e) {
      // приватный режим — просто показываем прелоудер каждый раз
    }
  </script>
</head>
